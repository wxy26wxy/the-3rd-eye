name: The3rdEye
options:
  bundleIdPrefix: com.the3rdeye
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: WHMG95UWKZ
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  The3rdEye:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.the3rdeye.app
        PRODUCT_NAME: The3rdEye
        INFOPLIST_FILE: App/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: "1"
        GIT_SHA: dev
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The production site. The only place iOS names it: API_BASE_URL defaults to it and
        # AppConfig falls back to it (Info.plist DeployedSiteURL) when API_BASE_URL is unusable.
        DEPLOYED_SITE_URL: "https://the-3rd-eye.vercel.app"
      configs:
        Debug:
          # Debug points at the deployed site so a phone build from Xcode works without a local server
          # (decision 2026-10-29). Use http://localhost:3000 to test against `pnpm dev` in the simulator.
          API_BASE_URL: "$(DEPLOYED_SITE_URL)"
        Release:
          # Deployed site (docs/handoffs/ios.md). Override: xcodebuild ... API_BASE_URL=https://...
          API_BASE_URL: "$(DEPLOYED_SITE_URL)"
    postBuildScripts:
      - name: Stamp git sha
        script: bash "${SRCROOT}/scripts/stamp_git_sha.sh"
        basedOnDependencyAnalysis: false
  The3rdEyeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: The3rdEye
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.the3rdeye.app.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/The3rdEye.app/The3rdEye"
        BUNDLE_LOADER: "$(TEST_HOST)"
  The3rdEyeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: The3rdEye
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.the3rdeye.app.uitests
        TEST_TARGET_NAME: The3rdEye
schemes:
  The3rdEye:
    build:
      targets:
        The3rdEye: all
        The3rdEyeTests: [test]
    test:
      targets:
        - The3rdEyeTests
      gatherCoverageData: false
  # Needs scripts/mock_api.py running and API_BASE_URL=http://localhost:3999.
  The3rdEyeUITests:
    build:
      targets:
        The3rdEye: all
        The3rdEyeUITests: [test]
    test:
      targets:
        - The3rdEyeUITests
