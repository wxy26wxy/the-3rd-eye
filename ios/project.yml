name: MakerStory
options:
  bundleIdPrefix: com.makerstory
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: WHMG95UWKZ
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  MakerStory:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.makerstory.app
        PRODUCT_NAME: MakerStory
        INFOPLIST_FILE: App/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "1"
        GIT_SHA: dev
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          # Debug points at the deployed site so a phone build from Xcode works without a local server
          # (decision 2026-10-29). Use http://localhost:3000 to test against `pnpm dev` in the simulator.
          API_BASE_URL: "https://maker-story-three.vercel.app"
        Release:
          # Deployed site (docs/handoffs/ios.md). Override: xcodebuild ... API_BASE_URL=https://...
          API_BASE_URL: "https://maker-story-three.vercel.app"
    postBuildScripts:
      - name: Stamp git sha
        script: bash "${SRCROOT}/scripts/stamp_git_sha.sh"
        basedOnDependencyAnalysis: false
  MakerStoryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: MakerStory
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.makerstory.app.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MakerStory.app/MakerStory"
        BUNDLE_LOADER: "$(TEST_HOST)"
  MakerStoryUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: MakerStory
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.makerstory.app.uitests
        TEST_TARGET_NAME: MakerStory
schemes:
  MakerStory:
    build:
      targets:
        MakerStory: all
        MakerStoryTests: [test]
    test:
      targets:
        - MakerStoryTests
      gatherCoverageData: false
  # Needs scripts/mock_api.py running and API_BASE_URL=http://localhost:3999.
  MakerStoryUITests:
    build:
      targets:
        MakerStory: all
        MakerStoryUITests: [test]
    test:
      targets:
        - MakerStoryUITests
